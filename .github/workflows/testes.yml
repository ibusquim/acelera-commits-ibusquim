# Roda os testes do painel de bordo a cada push e a cada pull request.
# A missão 6.3 ("Verde antes de juntar") espera este workflow terminar com sucesso no head do seu PR.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Rodar os testes
        run: node --test
